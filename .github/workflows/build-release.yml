name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versão da Release (ex: v1.0.0)"
        required: true
        default: "v1.0.0"
      create_release:
        description: "Criar GitHub Release pública?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Android APK
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          npx tauri android build --apk

      - name: Find and Copy APK
        id: copy_apk
        run: |
          mkdir -p output
          find src-tauri/gen/android -name "*.apk" -exec cp {} output/RevHunter-Reborn-${{ inputs.release_tag }}.apk \;
          echo "APK_PATH=output/RevHunter-Reborn-${{ inputs.release_tag }}.apk" >> $GITHUB_ENV

      - name: Sign Android APK
        run: |
          keytool -genkey -v -keystore release.jks -alias revhunter -keyalg RSA -keysize 2048 -validity 10000 -storepass revhunter -keypass revhunter -dname "CN=RevHunter, OU=Reborn, O=Hunter, L=SaoPaulo, S=SP, C=BR"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER sign --ks release.jks --ks-pass pass:revhunter --key-pass pass:revhunter output/RevHunter-Reborn-${{ inputs.release_tag }}.apk
          $APKSIGNER verify output/RevHunter-Reborn-${{ inputs.release_tag }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevHunter-Reborn-Android-APK
          path: output/*.apk

      - name: Publish to GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Rev Hunter Reborn ${{ inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows App (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install

      - name: Build Desktop App
        run: npm run tauri build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevHunter-Reborn-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach Windows to GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
